<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <title>Gloss Enhancer MSDS 10-28-11.pdf | SDS Library</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="description" content="">
    <link rel="stylesheet" href="/ananke/css/main.min.css">
  </head>
  <body class="ma0 avenir bg-near-white">
    <main class="pb7" role="main">
      

<style>
body {
    padding: 20px;
    font-family: sans-serif;
}

.sds-container {
    max-width: 900px;
    margin: 0 auto;
}

 
.back-home {
    display: inline-block;
    margin-bottom: 20px;
    padding: 8px 12px;
    background-color: #333;
    color: white;
    text-decoration: none;
    border-radius: 4px;
    font-size: 0.9rem;
}

.back-home:hover {
    background-color: #555;
}

.sds-actions {
    margin-top: 20px;
}

button {
    padding: 8px 12px;
    margin-right: 10px;
    margin-top: 10px;
    cursor: pointer;
}

 
.hidden {
    display: none;
}

#qrcode {
    margin-top: 20px;
}
</style>

<div class="sds-container">

<a href="/" class="back-home">← Back to Home/Search</a>

<h1>Gloss Enhancer MSDS 10-28-11.pdf</h1>

<p><strong>Manufacturer:</strong> 3M</p>


<div class="sds-actions">
<iframe src="/sds/3M/SUPERSEDED/Gloss%20Enhancer%20MSDS%2010-28-11.pdf" 
        style="width:100%; height:800px; border:1px solid #ccc;">
</iframe>

<p>
<a href="/sds/3M/SUPERSEDED/Gloss%20Enhancer%20MSDS%2010-28-11.pdf" target="_blank">
View PDF in new tab
</a>
</p>
</div>


<div class="sds-actions">

<button id="generate-qr">Generate QR Code</button>
<button id="download-qr" class="hidden">Download QR</button>
<button id="print-qr" class="hidden">Print QR</button>

<div id="qrcode"></div>

</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>

const pageURL = "https://sds.idensdealerservices.com\/sds\/3m-gloss_enhancer_msds_10-28-11\/";
const qrContainer = document.getElementById("qrcode");

const generateBtn = document.getElementById("generate-qr");
const downloadBtn = document.getElementById("download-qr");
const printBtn = document.getElementById("print-qr");

const PASSWORD = "sdsaccess";

generateBtn.addEventListener("click", function() {

    qrContainer.innerHTML = "";

    new QRCode(qrContainer, {
        text: pageURL,
        width: 200,
        height: 200
    });

    downloadBtn.classList.remove("hidden");
    printBtn.classList.remove("hidden");

});

 
downloadBtn.addEventListener("click", function() {

    const img = qrContainer.querySelector("img");

    const link = document.createElement("a");
    link.href = img.src;
    link.download = "SDS-QR.png";
    link.click();

});

 
printBtn.addEventListener("click", function(){

    const img = qrContainer.querySelector("img");

    const printWindow = window.open("", "_blank");

    printWindow.document.write(`
        <html>
        <head>
        <title>Print QR</title>
        <style>
        body {
            text-align:center;
            font-family:sans-serif;
            padding:40px;
        }
        img {
            width:320px;
        }
        h1 {
            margin-bottom:20px;
        }
        .subhead {
            font-size:18px;
            margin-top:20px;
        }
        .password {
            font-size:18px;
        }
        </style>
        </head>
        <body>

        <h1>Gloss Enhancer MSDS 10-28-11.pdf</h1>
        <img src="${img.src}" />

        <p class="subhead">Scan for SDS</p>
        <p class="password">Password: ${PASSWORD}</p>

        \x3Cscript>
        window.onload = function(){
            window.print();
        }
        <\/script>

        </body>
        </html>
    `);

    printWindow.document.close();

});

</script>


    </main>
  </body>
</html>
