{{ define "main" }}

<style>
body {
    padding: 20px;
    font-family: sans-serif;
}

.sds-container {
    max-width: 900px;
    margin: 0 auto;
}

/* Back button */
.back-home {
    display: inline-block;
    margin-bottom: 20px;
    padding: 8px 12px;
    background-color: #333;
    color: white;
    text-decoration: none;
    border-radius: 4px;
    font-size: 0.9rem;
}

.back-home:hover {
    background-color: #555;
}

.sds-actions {
    margin-top: 20px;
}

button {
    padding: 8px 12px;
    margin-right: 10px;
    margin-top: 10px;
    cursor: pointer;
}

/* Hidden until QR generated */
.hidden {
    display: none;
}

#qrcode {
    margin-top: 20px;
}
</style>

<div class="sds-container">

<a href="/" class="back-home">← Back to Home/Search</a>

<h1>{{ .Title }}</h1>

<p><strong>Manufacturer:</strong> {{ .Params.manufacturer }}</p>

<!-- Embedded PDF -->
<div class="sds-actions">
<iframe src="{{ .Params.pdf }}" 
        style="width:100%; height:800px; border:1px solid #ccc;">
</iframe>

<p>
<a href="{{ .Params.pdf }}" target="_blank">
View PDF in new tab
</a>
</p>
</div>

<!-- QR Tools -->
<div class="sds-actions">

<button id="generate-qr">Generate QR Code</button>
<button id="download-qr" class="hidden">Download QR</button>
<button id="print-qr" class="hidden">Print QR</button>

<div id="qrcode"></div>

</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>

const pageURL = "https://sds.idensdealerservices.com{{ .RelPermalink }}";
const qrContainer = document.getElementById("qrcode");

const generateBtn = document.getElementById("generate-qr");
const downloadBtn = document.getElementById("download-qr");
const printBtn = document.getElementById("print-qr");

const PASSWORD = "sdsaccess";

generateBtn.addEventListener("click", function() {

    qrContainer.innerHTML = "";

    new QRCode(qrContainer, {
        text: pageURL,
        width: 200,
        height: 200
    });

    downloadBtn.classList.remove("hidden");
    printBtn.classList.remove("hidden");

});

/* Download QR */
downloadBtn.addEventListener("click", function() {

    const img = qrContainer.querySelector("img");

    const link = document.createElement("a");
    link.href = img.src;
    link.download = "SDS-QR.png";
    link.click();

});

/* Print QR */
printBtn.addEventListener("click", function(){

    const img = qrContainer.querySelector("img");

    const printWindow = window.open("", "_blank");

    printWindow.document.write(`
        <html>
        <head>
        <title>Print QR</title>
        <style>
        body {
            text-align:center;
            font-family:sans-serif;
            padding:40px;
        }
        img {
            width:320px;
        }
        h1 {
            margin-bottom:20px;
        }
        .subhead {
            font-size:18px;
            margin-top:20px;
        }
        .password {
            font-size:18px;
        }
        </style>
        </head>
        <body>

        <h1>{{ .Title }}</h1>
        <img src="${img.src}" />

        <p class="subhead">Scan for SDS</p>
        <p class="password">Password: ${PASSWORD}</p>

        <script>
        window.onload = function(){
            window.print();
        }
        <\/script>

        </body>
        </html>
    `);

    printWindow.document.close();

});

</script>

{{ end }}
